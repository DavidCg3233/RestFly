<div class="flex flex-col gap-6 text-[var(--texto)] pb-10" id="modulo-reportes-contenedor">
    
    <div class="bg-[var(--tarjeta)] border border-[var(--borde)] rounded-xl shadow-lg transition-colors duration-300">
        <div class="p-4 border-b border-[var(--borde)] flex items-center gap-2">
            <i data-lucide="filter" class="w-5 h-5 text-[var(--primario)]"></i>
            <h2 class="text-base font-bold text-[var(--tarjeta-texto)]">Filtros</h2>
        </div>
        <div class="p-4 flex flex-col md:flex-row gap-4">
            <div class="flex-1">
                <label class="block text-xs font-semibold text-[var(--texto-apagado)] mb-1">Fecha Inicio</label>
                <input type="date" id="filtro-fecha-inicio" class="w-full h-10 px-3 rounded-lg border border-[var(--borde)] bg-[var(--secundario)] text-[var(--texto)] text-sm focus:outline-none focus:border-[var(--primario)] transition-colors">
            </div>
            <div class="flex-1">
                <label class="block text-xs font-semibold text-[var(--texto-apagado)] mb-1">Fecha Fin</label>
                <input type="date" id="filtro-fecha-fin" class="w-full h-10 px-3 rounded-lg border border-[var(--borde)] bg-[var(--secundario)] text-[var(--texto)] text-sm focus:outline-none focus:border-[var(--primario)] transition-colors">
            </div>
            <div class="flex-1 flex items-end">
                <button id="btn-exportar-reportes" class="w-full flex items-center justify-center gap-2 h-10 rounded-lg font-bold text-sm bg-[var(--primario)] text-[var(--primario-texto)] hover:opacity-90 transition-opacity">
                    <i data-lucide="download" class="w-4 h-4"></i> Exportar
                </button>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="contenedor-tabs">
        <button onclick="window.cambiarTabReportes('ventas')" id="tab-ventas" class="py-2.5 rounded-lg text-sm font-bold transition-all bg-[var(--primario)] text-[var(--primario-texto)] border border-transparent">Ventas</button>
        <button onclick="window.cambiarTabReportes('inventario')" id="tab-inventario" class="py-2.5 rounded-lg text-sm font-bold transition-all bg-[var(--secundario)] text-[var(--texto)] border border-[var(--borde)] hover:border-[var(--primario)]">Inventario</button>
        <button onclick="window.cambiarTabReportes('productos')" id="tab-productos" class="py-2.5 rounded-lg text-sm font-bold transition-all bg-[var(--secundario)] text-[var(--texto)] border border-[var(--borde)] hover:border-[var(--primario)]">Productos</button>
        <button onclick="window.cambiarTabReportes('gastos')" id="tab-gastos" class="py-2.5 rounded-lg text-sm font-bold transition-all bg-[var(--secundario)] text-[var(--texto)] border border-[var(--borde)] hover:border-[var(--primario)]">Gastos</button>
    </div>

    <div id="vista-activa-reportes" class="flex flex-col gap-6 animate-in fade-in duration-300">
        
        <div id="contenedor-tarjetas-resumen" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        </div>

        <div class="bg-[var(--tarjeta)] border border-[var(--borde)] rounded-xl p-5 transition-colors duration-300">
            <h3 class="text-sm font-bold text-[var(--tarjeta-texto)] mb-4" id="titulo-grafica">Ventas por Día</h3>
            <div class="w-full h-[350px] relative">
                <canvas id="grafica-principal"></canvas>
            </div>
        </div>
        
        <div class="bg-[var(--tarjeta)] border border-[var(--borde)] rounded-xl p-5 transition-colors duration-300 overflow-hidden">
            <h3 class="text-sm font-bold text-[var(--tarjeta-texto)] mb-4" id="titulo-tabla">Detalle de Registros</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabla-datos-reportes">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>
</div>
