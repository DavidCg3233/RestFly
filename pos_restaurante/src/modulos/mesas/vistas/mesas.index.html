<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="flex flex-col gap-6 pb-10" id="app-mesas">
    
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-2xl font-bold text-foreground">Mapa de Mesas</h2>
            <p class="text-muted text-sm mt-1">Gestión en tiempo real de disponibilidad y pedidos</p>
        </div>
        
        <div class="flex items-center justify-between md:justify-end gap-4 w-full md:w-auto">
            <button id="btn-crear-mesa" onclick="window.abrirModalNuevaMesa()" class="hidden bg-primary text-primary-foreground px-4 py-2 rounded-xl font-bold hover:brightness-110 transition-all flex items-center gap-2 shadow-lg">
                <i data-lucide="plus" class="w-4 h-4"></i> Nueva Mesa
            </button>

            <div class="flex items-center gap-2 px-3 py-1.5 bg-secondary rounded-lg border border-border ml-auto md:ml-0">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs font-medium" id="nombre-mesero">Admin Principal</span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="contenedor-filtros"></div>
    <div id="contenedor-zonas" class="flex flex-col gap-8"></div>

    <div id="modal-crear-mesa" class="hidden fixed inset-0 bg-background/80 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
        <div class="bg-card border border-border p-6 rounded-2xl w-full max-w-sm shadow-2xl animate-in zoom-in-95 duration-200">
            <h3 class="text-lg font-black mb-4 text-foreground">Crear Nueva Mesa</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-muted-foreground uppercase">Número de Mesa</label>
                    <input type="number" id="nueva-mesa-numero" class="w-full bg-background border border-border rounded-lg p-2 mt-1 text-foreground focus:border-primary outline-none" placeholder="Ej: 10">
                </div>
                <div>
                    <label class="text-xs font-bold text-muted-foreground uppercase">Capacidad (Personas)</label>
                    <input type="number" id="nueva-mesa-capacidad" class="w-full bg-background border border-border rounded-lg p-2 mt-1 text-foreground focus:border-primary outline-none" placeholder="Ej: 4">
                </div>
                <div>
                    <label class="text-xs font-bold text-muted-foreground uppercase">Zona</label>
                    <input type="text" id="nueva-mesa-zona" class="w-full bg-background border border-border rounded-lg p-2 mt-1 text-foreground focus:border-primary outline-none" placeholder="Ej: Terraza">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="window.cerrarModalNuevaMesa()" class="px-4 py-2 rounded-lg text-sm font-bold text-muted-foreground hover:bg-secondary transition-colors">Cancelar</button>
                <button onclick="window.guardarNuevaMesa()" class="px-4 py-2 rounded-lg text-sm font-bold bg-primary text-primary-foreground hover:brightness-110 transition-all shadow-md">Guardar Mesa</button>
            </div>
        </div>
    </div>

    <div id="modal-pedido" class="fixed inset-0 bg-black/60 z-[60] hidden flex items-center justify-center p-0 sm:p-4 backdrop-blur-sm animate-in fade-in duration-200">
        <div class="absolute inset-0 hidden sm:block" onclick="window.cerrarModalPedido()"></div>

        <div class="bg-card border-0 sm:border border-border text-foreground w-full sm:max-w-5xl h-[100dvh] sm:h-auto sm:max-h-[90vh] sm:rounded-2xl flex flex-col shadow-2xl relative z-10 overflow-hidden animate-in zoom-in-95 duration-200" id="modal-contenido">
            
            <div class="px-4 sm:px-6 py-4 border-b border-border bg-muted/30 shrink-0">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <div class="p-2 bg-primary/10 rounded-lg shrink-0">
                            <i data-lucide="layout-dashboard" class="w-5 h-5 text-primary"></i>
                        </div>
                        <div class="min-w-0">
                            <h3 class="text-lg font-bold truncate" id="modal-titulo-mesa">Mesa # --</h3>
                            <p class="text-muted text-[10px] uppercase tracking-wider font-semibold" id="modal-subtitulo-pedido">SIN PEDIDO</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
                        <div class="flex p-1 bg-secondary rounded-xl border border-border overflow-x-auto scrollbar-none max-w-[70vw] sm:max-w-none whitespace-nowrap" id="modal-botones-estado"></div>
                        
                        <button onclick="window.cerrarModalPedido()" class="p-2 hover:bg-destructive/10 hover:text-destructive rounded-full transition-colors shrink-0">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden min-h-0">
                
                <div class="flex-1 flex flex-col overflow-hidden border-b lg:border-b-0 lg:border-r border-border min-h-[50vh] lg:min-h-0">
                    <div class="flex gap-2 p-3 bg-background border-b border-border overflow-x-auto whitespace-nowrap shrink-0 scrollbar-none">
                        <button onclick="window.cambiarTab('Comida')" id="tab-Comida" class="tab-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2 shrink-0">
                            <i data-lucide="utensils" class="w-4 h-4"></i> Comida
                        </button>
                        <button onclick="window.cambiarTab('Bebida')" id="tab-Bebida" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2 text-muted hover:bg-secondary shrink-0">
                            <i data-lucide="cup-soda" class="w-4 h-4"></i> Bebida
                        </button>
                        <button onclick="window.cambiarTab('Postre')" id="tab-Postre" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all flex items-center gap-2 text-muted hover:bg-secondary shrink-0">
                            <i data-lucide="cake-slice" class="w-4 h-4"></i> Postres
                        </button>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-3 sm:p-4 custom-scrollbar">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5" id="contenedor-menu"></div>
                    </div>
                </div>

                <div class="w-full lg:w-80 shrink-0 flex flex-col bg-muted/5 lg:bg-muted/10 min-h-[40vh] lg:min-h-0 border-t lg:border-t-0 border-border">
                    <div class="p-3 sm:p-4 border-b border-border flex items-center justify-between bg-background shrink-0">
                        <span class="font-bold text-sm flex items-center gap-2">
                            <i data-lucide="shopping-cart" class="w-4 h-4 text-primary"></i> Detalle Comanda
                        </span>
                        <span class="text-[9px] bg-primary/20 text-primary px-2 py-0.5 rounded-full font-bold tracking-wide">ACTIVO</span>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-3 sm:p-4 flex flex-col gap-2 custom-scrollbar" id="contenedor-pedido-items"></div>

                    <div class="p-4 sm:p-6 border-t border-border bg-card shrink-0 shadow-[0_-4px_12px_rgba(0,0,0,0.03)]">
                        <div class="flex justify-between items-end mb-4">
                            <span class="text-muted text-xs font-medium uppercase tracking-wider">Subtotal Orden</span>
                            <span class="text-xl sm:text-2xl font-mono font-black text-foreground" id="pedido-total">$0.00</span>
                        </div>
                        <button onclick="window.confirmarPedido(event)" class="w-full bg-primary text-primary-foreground hover:brightness-110 active:scale-[0.98] font-black text-sm uppercase py-4 rounded-xl transition-all shadow-lg shadow-primary/25 flex items-center justify-center gap-2 tracking-wide">
                            <i data-lucide="send" class="w-4 h-4"></i> Enviar a Cocina
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
