<div class="flex flex-col gap-6 pb-10" id="app-facturacion">
    
    <div id="fac-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4 animate-in fade-in duration-200 backdrop-blur-sm">
        <div class="bg-card border border-primary/30 w-full max-w-md rounded-xl shadow-2xl flex flex-col scale-95 transition-transform" id="fac-modal-content">
            <div class="bg-primary/5 border-b border-primary/20 p-6 rounded-t-xl">
                <div class="flex items-center gap-2 text-xl font-semibold text-foreground">
                    <i data-lucide="receipt" class="w-5 h-5 text-primary"></i>
                    Factura de Venta
                </div>
                <p class="text-sm text-muted mt-1" id="fac-modal-mesa">Mesa --</p>
            </div>
            
            <div class="p-6 flex flex-col gap-4">
                <div class="flex flex-col gap-2 pb-4 border-b border-border" id="fac-modal-items">
                    </div>

                <div class="flex flex-col gap-2">
                    <div class="flex justify-between text-sm">
                        <span class="text-muted">Subtotal</span>
                        <span class="text-foreground font-medium" id="fac-modal-subtotal">$0.00</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-muted">IVA (16%)</span>
                        <span class="text-foreground font-medium" id="fac-modal-iva">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-border mt-1">
                        <span class="font-bold text-foreground text-lg">TOTAL</span>
                        <span class="font-black text-primary text-2xl" id="fac-modal-total">$0.00</span>
                    </div>
                </div>

                <div class="flex flex-col gap-2 mt-2">
                    <p class="text-sm font-semibold text-foreground">Método de Pago</p>
                    <div class="grid grid-cols-3 gap-2" id="fac-payment-methods">
                        <button onclick="seleccionarMetodoPago('efectivo')" id="btn-pay-efectivo" class="flex flex-col items-center justify-center py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-primary text-primary-foreground border-primary">
                            <i data-lucide="dollar-sign" class="w-4 h-4 mb-1"></i> Efectivo
                        </button>
                        <button onclick="seleccionarMetodoPago('tarjeta')" id="btn-pay-tarjeta" class="flex flex-col items-center justify-center py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-secondary text-foreground border-border hover:border-primary">
                            <i data-lucide="credit-card" class="w-4 h-4 mb-1"></i> Tarjeta
                        </button>
                        <button onclick="seleccionarMetodoPago('transferencia')" id="btn-pay-transferencia" class="flex flex-col items-center justify-center py-2 px-3 rounded-lg text-xs font-medium transition-all border bg-secondary text-foreground border-border hover:border-primary">
                            <i data-lucide="building-2" class="w-4 h-4 mb-1"></i> Transfer.
                        </button>
                    </div>
                </div>

                <div class="flex gap-2 pt-4 mt-2">
                    <button onclick="cerrarModalPago()" class="flex-1 py-2 rounded-lg font-medium text-sm text-muted hover:bg-secondary border border-transparent transition-colors">Cancelar</button>
                    <button onclick="procesarPago()" class="flex-1 py-2 rounded-lg font-bold text-sm bg-primary text-primary-foreground hover:bg-primary/90 shadow-md transition-colors">Procesar Pago</button>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-in slide-in-from-bottom-4 duration-500">
        
        <div class="bg-card border border-border/50 rounded-xl shadow-sm flex flex-col">
            <div class="p-6 border-b border-border/50">
                <h3 class="flex items-center gap-2 text-lg font-semibold text-foreground">
                    <i data-lucide="receipt" class="w-5 h-5 text-primary"></i>
                    Pedidos Listos para Pagar
                </h3>
                <p class="text-sm text-muted mt-1" id="fac-pending-count">0 pedido(s) pendiente(s)</p>
            </div>
            <div class="p-6 flex-1">
                <div class="flex flex-col gap-2 max-h-96 overflow-y-auto custom-scrollbar pr-2" id="fac-pending-list">
                    </div>
            </div>
        </div>

        <div class="flex flex-col gap-6">
            <div class="bg-card border border-border/50 rounded-xl shadow-sm p-6">
                <h3 class="text-sm font-semibold text-foreground mb-4">Ventas Hoy</h3>
                <p class="text-4xl font-black text-primary tracking-tight" id="fac-stats-total">$0.00</p>
                <p class="text-xs text-muted mt-2 font-medium" id="fac-stats-count">0 transacción(es)</p>
            </div>

            <div class="bg-card border border-border/50 rounded-xl shadow-sm p-6 flex-1">
                <h3 class="text-sm font-semibold text-foreground mb-4">Desglose por Método</h3>
                <div class="flex flex-col gap-3" id="fac-stats-methods">
                    </div>
            </div>
        </div>
    </div>

    <div class="bg-card border border-border/50 rounded-xl shadow-sm animate-in fade-in duration-700 delay-100">
        <div class="p-6 border-b border-border/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h3 class="text-lg font-semibold text-foreground">Historial de Ventas</h3>
                <p class="text-sm text-muted mt-1" id="fac-history-count">0 transacción(es)</p>
            </div>
            <div class="flex gap-2">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-muted"></i>
                    <input type="text" id="fac-search" placeholder="Buscar ID, Mesero..." class="pl-9 h-9 w-full sm:w-64 rounded-md border border-border bg-secondary text-sm text-foreground focus:outline-none focus:ring-1 focus:ring-primary" oninput="filtrarHistorial()">
                </div>
                <button class="p-2 rounded-lg bg-secondary hover:bg-secondary/80 border border-border transition-colors text-muted hover:text-foreground">
                    <i data-lucide="filter" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-muted uppercase bg-secondary/30 border-b border-border">
                    <tr>
                        <th class="py-3 px-6 font-medium">ID Venta</th>
                        <th class="py-3 px-6 font-medium">Mesa</th>
                        <th class="py-3 px-6 font-medium">Mesero</th>
                        <th class="py-3 px-6 font-medium">Método</th>
                        <th class="py-3 px-6 font-medium text-right">Total</th>
                        <th class="py-3 px-6 font-medium">Hora</th>
                    </tr>
                </thead>
                <tbody id="fac-history-table" class="divide-y divide-border">
                    </tbody>
            </table>
        </div>
    </div>

</div>
