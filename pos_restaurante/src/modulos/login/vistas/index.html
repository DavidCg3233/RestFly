<!DOCTYPE html>
<html lang="es" class="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestFly - Panel de Ingreso</title>
    <link rel="stylesheet" href="../../../compartido/utilidades/estilos.css">
    
    <script>
        if (localStorage.getItem('tema') === 'claro') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Habilitamos el modo oscuro por clase
            theme: {
                extend: {
                    colors: {
                        background: 'var(--fondo)',
                        foreground: 'var(--texto)',
                        card: 'var(--tarjeta)',
                        primary: 'var(--primario)',
                        'primary-foreground': 'var(--primario-texto)',
                        secondary: 'var(--secundario)',
                        muted: 'var(--texto-apagado)',
                        destructive: 'var(--peligro)',
                        border: 'var(--borde)',
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-background text-foreground transition-colors duration-300">

    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/3 w-[500px] h-[500px] rounded-full opacity-10 bg-primary blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/3 w-96 h-96 rounded-full opacity-5 bg-primary blur-[100px]"></div>
    </div>

    <div class="w-full max-w-[400px] bg-card border border-border rounded-[20px] shadow-2xl relative z-10 flex flex-col overflow-hidden">
        
        <div class="flex flex-col items-center pt-8 pb-6 px-10">
            <div class="relative">
                <div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full"></div>
                <img src="../../../compartido/utilidades/img/Restfly_sencillo.png" alt="Logo" 
                    class="w-32 h-32 relative z-10 object-contain mb-2">
            </div>
            <h2 class="text-foreground font-bold text-lg">Bienvenido a RestFly</h2>
            <p class="text-muted text-[11px] uppercase tracking-[0.2em]">Control de Acceso</p>
        </div>

        <form id="formulario-login" class="px-10 pb-8 flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label for="usuario" class="text-muted text-[13px] font-medium ml-1">Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario" required
                    class="w-full bg-secondary border border-border text-foreground h-11 px-4 rounded-lg focus:outline-none focus:border-primary transition-all placeholder:text-muted/50">
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="clave" class="text-muted text-[13px] font-medium ml-1">Contraseña</label>
                <div class="relative">
                    <input type="password" id="clave" placeholder="Ingresa tu contraseña" required
                        class="w-full bg-secondary border border-border text-foreground h-11 px-4 pr-12 rounded-lg focus:outline-none focus:border-primary transition-all placeholder:text-muted/50">
                    <button type="button" id="boton-ojo" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-primary transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div id="mensaje-error" class="hidden">
                <p class="text-destructive text-[13px] font-medium text-center bg-destructive/10 py-2 rounded-lg">⚠ Credenciales incorrectas</p>
            </div>

            <button type="submit" id="boton-ingresar"
                class="mt-4 h-12 bg-primary text-primary-foreground text-base font-bold rounded-lg hover:brightness-110 active:scale-[0.97] transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                <span id="texto-boton">Ingresar</span>
                <div id="cargador-boton" class="hidden h-5 w-5 border-2 border-primary-foreground/30 border-t-primary-foreground rounded-full animate-spin"></div>
            </button>
        </form>

        <div class="text-center pb-6 text-muted text-[10px] uppercase tracking-tighter">
            <p>RestFly Beta — Gestión Operativa Inteligente</p>
        </div>        
    </div>

    <script src="../controladores/login_frontend.js"></script>
</body>
</html>
