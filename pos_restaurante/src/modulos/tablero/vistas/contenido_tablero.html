<div id="app-tablero" class="flex flex-col gap-6 pb-10 animate-in fade-in duration-300">

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 gap-4">
        <h2 class="text-2xl font-bold text-foreground">Resumen de Hoy</h2>
        
        <button data-modulo="Reportes" onclick="cargarModulo('../../modulos/reportes/vistas/reportes.index.html', 'Reportes', '../../modulos/reportes/controladores/reportes.frontend.js')" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all bg-primary text-primary-foreground hover:bg-primary/90 shadow-sm border border-transparent focus:ring-2 focus:ring-primary/50">
            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
            <span>Ir a Reportes Detallados</span>
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        
        <div class="bg-card border border-border rounded-2xl p-5 shadow-lg relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-24 h-24 bg-primary/10 rounded-full blur-2xl"></div>
            <div class="flex items-start justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-primary/20 flex items-center justify-center border border-primary/30">
                    <i data-lucide="dollar-sign" class="w-5 h-5 text-primary"></i>
                </div>
                <span class="text-xs font-bold text-green-500 bg-green-500/10 px-2 py-1 rounded-md" id="tablero-tendencia-ventas">+0%</span>
            </div>
            <p class="text-muted text-sm font-medium mb-1">Ventas del Día</p>
            <h3 class="text-2xl font-bold text-foreground" id="tablero-total-ventas">$0.00</h3>
        </div>

        <div class="bg-card border border-border rounded-2xl p-5 shadow-lg">
            <div class="flex items-start justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-secondary flex items-center justify-center border border-border">
                    <i data-lucide="users" class="w-5 h-5 text-foreground"></i>
                </div>
            </div>
            <p class="text-muted text-sm font-medium mb-1">Mesas Ocupadas</p>
            <h3 class="text-2xl font-bold text-foreground" id="tablero-mesas-ocupadas">0 <span class="text-sm font-normal text-muted">/ 0</span></h3>
        </div>

        <div class="bg-card border border-border rounded-2xl p-5 shadow-lg">
            <div class="flex items-start justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-orange-500/20 flex items-center justify-center border border-orange-500/30">
                    <i data-lucide="chef-hat" class="w-5 h-5 text-orange-500"></i>
                </div>
                <span class="flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-orange-500"></span>
                </span>
            </div>
            <p class="text-muted text-sm font-medium mb-1">Pedidos Pendientes</p>
            <h3 class="text-2xl font-bold text-foreground" id="tablero-pedidos-pendientes">0</h3>
        </div>

        <div class="bg-card border border-border rounded-2xl p-5 shadow-lg">
            <div class="flex items-start justify-between mb-4">
                <div class="w-10 h-10 rounded-xl bg-destructive/20 flex items-center justify-center border border-destructive/30">
                    <i data-lucide="package-minus" class="w-5 h-5 text-destructive"></i>
                </div>
            </div>
            <p class="text-muted text-sm font-medium mb-1">Alertas Inventario</p>
            <h3 class="text-2xl font-bold text-foreground" id="tablero-alertas-inv">0 <span class="text-sm font-normal text-muted">ítems</span></h3>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-card border border-border rounded-2xl p-6 shadow-lg lg:col-span-2 flex flex-col">
            <h3 class="text-lg font-bold text-foreground mb-4">Ventas de la Semana</h3>
            <div class="relative flex-1 w-full min-h-[300px]">
                <canvas id="ventasChart"></canvas>
            </div>
        </div>

        <div class="bg-card border border-border rounded-2xl p-6 shadow-lg flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-foreground flex items-center gap-2">
                    <i data-lucide="trophy" class="w-5 h-5 text-yellow-500"></i>
                    Top Platos
                </h3>
                <span class="text-[10px] font-medium text-muted bg-secondary px-2 py-1 rounded-md uppercase tracking-wider">30 Días</span>
            </div>
            
            <div class="flex flex-col gap-3 flex-1 overflow-y-auto custom-scrollbar" id="tablero-top-platos">
                <div class="flex items-center justify-center h-full">
                    <p class="text-sm text-muted animate-pulse">Cargando platos...</p>
                </div>
            </div>
        </div>
        
    </div>

    <div class="bg-card border border-border rounded-2xl p-6 shadow-lg">
        <h3 class="text-lg font-bold text-foreground mb-4">Actividad Reciente</h3>
        
        <div class="text-muted text-sm flex flex-col gap-3" id="tablero-actividad-reciente">
            <p class="text-sm text-muted animate-pulse">Cargando actividad...</p>
        </div>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../../modulos/tablero/controladores/tablero_frontend.js"></script>
